appId: com.duocast.control
productName: DuoCast Control
copyright: Copyright © 2024

files:
  - src/main/**
  - src/preload.js
  - dist/renderer/**
  - assets/**
  - package.json

extraResources:
  - from: assets/
    to: assets/

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: assets/icon.icns
  minimumSystemVersion: "13.0"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  title: DuoCast Control
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

nativeRebuilder: electron-rebuild
npmRebuild: true
