<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Microphone body -->
  <rect x="8" y="2" width="6" height="10" rx="3" fill="black"/>
  <!-- Microphone stand arc -->
  <path d="M5 10 Q5 16 11 16 Q17 16 17 10"
        fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Stand post -->
  <line x1="11" y1="16" x2="11" y2="20"
        stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Stand base -->
  <line x1="7.5" y1="20" x2="14.5" y2="20"
        stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Mute slash (diagonal line through the mic) -->
  <line x1="3" y1="3" x2="19" y2="19"
        stroke="black" stroke-width="2" stroke-linecap="round"/>
</svg>
